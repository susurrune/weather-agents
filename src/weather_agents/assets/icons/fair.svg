<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.35" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sun rays -->
  <g stroke="url(#sg)" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="4" x2="24" y2="10"/>
    <line x1="24" y1="38" x2="24" y2="44"/>
    <line x1="4" y1="24" x2="10" y2="24"/>
    <line x1="38" y1="24" x2="44" y2="24"/>
    <line x1="9.4" y1="9.4" x2="13.8" y2="13.8"/>
    <line x1="34.2" y1="34.2" x2="38.6" y2="38.6"/>
    <line x1="9.4" y1="38.6" x2="13.8" y2="34.2"/>
    <line x1="34.2" y1="13.8" x2="38.6" y2="9.4"/>
  </g>
  <!-- Sun circle -->
  <circle cx="24" cy="24" r="10" fill="url(#sg)"/>
  <!-- Highlight -->
  <ellipse cx="21" cy="21" rx="5" ry="5" fill="url(#hl)"/>
</svg>
