<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1424">
<title>晴 · 阳光对话</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #f5c542;
    --gold-soft: #ffd874;
    --gold-deep: #b8860b;
    --bg: #15101e;
    --bg-grad-1: #1a1424;
    --bg-grad-2: #221830;
    --bg-card: #221a30;
    --bg-bubble-user: #2d2240;
    --bg-bubble-agent: rgba(245,197,66,0.06);
    --bubble-border-agent: rgba(245,197,66,0.16);
    --bubble-border-user: rgba(245,197,66,0.10);
    --text: #ece3d2;
    --text-soft: #c4b89e;
    --text-dim: #8a7f68;
    --green: #6fd9a0;
    --red: #ef6e6e;
    --blue: #7ec5f5;
    --radius-card: 20px;
    --radius-bubble: 18px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", Roboto, sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(245,197,66,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(126,197,245,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    background: rgba(26,20,36,0.75);
    border-bottom: 1px solid rgba(245,197,66,0.10);
    flex-shrink: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--gold-soft), var(--gold) 40%, var(--gold-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #1a1424; font-weight: 700; font-size: 18px;
    box-shadow: 0 0 0 0 rgba(245,197,66,0.0), 0 6px 18px rgba(245,197,66,0.18);
    transition: box-shadow 0.4s ease, transform 0.4s ease;
    flex-shrink: 0;
  }
  .brand-avatar.speaking {
    animation: glow 1.6s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,197,66,0.0), 0 6px 18px rgba(245,197,66,0.20); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(245,197,66,0.0), 0 6px 24px rgba(245,197,66,0.45); transform: scale(1.04); }
  }
  .brand-text { line-height: 1.15; }
  .brand-name {
    font-size: 17px; font-weight: 600;
    letter-spacing: 1px; color: var(--text);
  }
  .brand-name .accent { color: var(--gold); }
  .brand-tag {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.3px; margin-top: 2px;
  }

  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px 5px 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 999px;
    font-size: 11px; color: var(--text-soft);
    transition: background 0.25s, border-color 0.25s, color 0.25s;
  }
  .status-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red); transition: background 0.3s, box-shadow 0.3s;
  }
  .status-pill.connected .dot { background: var(--green); box-shadow: 0 0 6px rgba(111,217,160,0.6); }
  .status-pill.listening .dot { background: var(--gold); box-shadow: 0 0 8px rgba(245,197,66,0.7); animation: dot-pulse 1.1s ease-in-out infinite; }
  .status-pill.speaking .dot { background: var(--blue); box-shadow: 0 0 8px rgba(126,197,245,0.7); }
  .status-pill.waiting .dot { background: var(--gold-soft); animation: dot-pulse 1.4s ease-in-out infinite; }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.55; }
  }

  /* ── Agent chip row ── */
  .agent-row {
    flex-shrink: 0;
    display: flex; gap: 8px;
    padding: 10px 14px;
    overflow-x: auto;
    background: linear-gradient(180deg, rgba(245,197,66,0.03), transparent);
    border-bottom: 1px solid rgba(245,197,66,0.05);
    scrollbar-width: none;
  }
  .agent-row::-webkit-scrollbar { display: none; }
  .agent-chip {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px 6px 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(245,197,66,0.10);
    border-radius: 999px;
    cursor: pointer; font-size: 12px; color: var(--text-soft);
    transition: all 0.2s;
    user-select: none;
  }
  .agent-chip:hover { background: rgba(245,197,66,0.08); color: var(--text); }
  .agent-chip.active {
    background: linear-gradient(135deg, rgba(245,197,66,0.18), rgba(245,197,66,0.08));
    border-color: rgba(245,197,66,0.40);
    color: var(--gold);
  }
  .agent-chip .chip-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(245,197,66,0.20);
    font-size: 12px; font-weight: 600;
  }
  .agent-chip.active .chip-avatar {
    background: var(--gold); color: #1a1424;
  }

  /* ── Reconnect bar ── */
  .reconnect-bar {
    display: none;
    text-align: center; padding: 8px;
    background: linear-gradient(90deg, rgba(239,110,110,0.18), rgba(239,110,110,0.10));
    color: var(--red); font-size: 13px;
    flex-shrink: 0; cursor: pointer;
    border-bottom: 1px solid rgba(239,110,110,0.20);
  }
  .reconnect-bar.show { display: block; }
  .reconnect-bar:hover { background: rgba(239,110,110,0.28); }

  /* ── Messages ── */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 18px 14px 24px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
    overscroll-behavior: contain;
  }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: rgba(245,197,66,0.18); border-radius: 3px; }
  #messages::-webkit-scrollbar-thumb:hover { background: rgba(245,197,66,0.35); }

  .msg-row {
    display: flex; gap: 10px;
    align-items: flex-end;
    max-width: 100%;
    animation: slide-in 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: 700; font-size: 14px;
    align-self: flex-start; margin-top: 2px;
  }
  .msg-avatar.agent {
    background: radial-gradient(circle at 30% 30%, var(--gold-soft), var(--gold) 50%, var(--gold-deep));
    color: #1a1424;
    box-shadow: 0 2px 8px rgba(245,197,66,0.20);
  }
  .msg-avatar.user {
    background: linear-gradient(135deg, #4a3a6a, #2d2240);
    color: var(--text-soft);
    border: 1px solid rgba(245,197,66,0.10);
  }
  .msg-bubble {
    max-width: calc(100% - 56px);
    padding: 11px 15px 12px;
    border-radius: var(--radius-bubble);
    font-size: 15px; line-height: 1.62;
    word-wrap: break-word; word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-row.user .msg-bubble {
    background: var(--bg-bubble-user);
    border: 1px solid var(--bubble-border-user);
    border-bottom-right-radius: 6px;
    color: var(--text);
  }
  .msg-row.agent .msg-bubble {
    background: var(--bg-bubble-agent);
    border: 1px solid var(--bubble-border-agent);
    border-bottom-left-radius: 6px;
    color: var(--text);
  }
  .msg-bubble .name {
    display: block;
    font-size: 11px; font-weight: 600;
    color: var(--gold);
    margin-bottom: 3px;
    letter-spacing: 0.5px;
  }
  .msg-row.user .msg-bubble .name { color: var(--text-soft); }
  .msg-row.agent.streaming .msg-bubble::after {
    content: "";
    display: inline-block;
    width: 7px; height: 14px;
    background: var(--gold);
    margin-left: 2px;
    animation: caret-blink 0.95s steps(2) infinite;
    vertical-align: -2px;
    border-radius: 1.5px;
  }
  @keyframes caret-blink { 50% { opacity: 0; } }

  /* ── Status / system messages ── */
  .sys-msg {
    align-self: center;
    color: var(--text-dim);
    font-size: 12px;
    padding: 2px 14px;
    background: rgba(255,255,255,0.02);
    border-radius: 999px;
    max-width: 90%;
    text-align: center;
    letter-spacing: 0.3px;
    animation: fade-in 0.4s;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* ── Welcome ── */
  .welcome {
    align-self: stretch;
    margin: 6px auto;
    max-width: 420px;
    padding: 20px 22px;
    background: linear-gradient(135deg, rgba(245,197,66,0.08), rgba(245,197,66,0.02));
    border: 1px solid rgba(245,197,66,0.15);
    border-radius: var(--radius-card);
    text-align: center;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.7;
  }
  .welcome strong { color: var(--gold); font-weight: 600; }
  .welcome .tip { display: block; font-size: 12px; color: var(--text-dim); margin-top: 8px; }

  /* ── Thinking indicator ── */
  .think {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    align-self: flex-start;
    margin-left: 42px;
  }
  .think-dots { display: inline-flex; gap: 4px; }
  .think-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold);
    opacity: 0.5;
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .think-dots span:nth-child(2) { animation-delay: 0.18s; }
  .think-dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dot-bounce {
    0%, 70%, 100% { transform: translateY(0); opacity: 0.45; }
    35% { transform: translateY(-5px); opacity: 1; }
  }
  .think-label { color: var(--text-dim); font-size: 13px; }

  /* ── Input ── */
  #input-area {
    flex-shrink: 0;
    padding: 12px 14px;
    padding-bottom: calc(12px + var(--safe-bottom));
    background: rgba(26,20,36,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(245,197,66,0.10);
    display: flex; gap: 10px; align-items: flex-end;
  }
  .input-wrap {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(245,197,66,0.12);
    border-radius: 16px;
    transition: border-color 0.2s, background 0.2s;
    display: flex; align-items: center;
    padding-right: 4px;
  }
  .input-wrap:focus-within {
    border-color: rgba(245,197,66,0.50);
    background: rgba(255,255,255,0.06);
  }
  #text-input {
    flex: 1;
    background: transparent; border: none; outline: none;
    color: var(--text);
    padding: 11px 14px;
    font-size: 15px;
    font-family: var(--font);
    resize: none;
    min-height: 22px; max-height: 140px;
    line-height: 1.4;
  }
  #text-input::placeholder { color: var(--text-dim); }
  .btn {
    border: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.25s, background 0.25s;
    color: #1a1424; font-size: 18px;
  }
  .btn:active { transform: scale(0.92); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.send {
    background: var(--gold);
    box-shadow: 0 4px 14px rgba(245,197,66,0.25);
  }
  .btn.send:not(:disabled):hover { background: var(--gold-soft); box-shadow: 0 6px 18px rgba(245,197,66,0.35); }
  .btn.mic {
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    box-shadow: 0 4px 14px rgba(245,197,66,0.25);
    position: relative;
  }
  .btn.mic:hover { box-shadow: 0 6px 18px rgba(245,197,66,0.40); }
  .btn.mic.active {
    background: linear-gradient(135deg, #ff8a8a, var(--red));
    color: #fff;
    box-shadow: 0 4px 14px rgba(239,110,110,0.35);
  }
  .btn.mic.active::before {
    content: "";
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 2px solid rgba(239,110,110,0.55);
    animation: ripple 1.3s ease-out infinite;
  }
  @keyframes ripple {
    0% { transform: scale(0.95); opacity: 0.9; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  /* ── Settings drawer ── */
  #settings-panel {
    display: none;
    padding: 14px 18px;
    background: rgba(34,26,48,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(245,197,66,0.10);
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text-soft);
    animation: settings-slide 0.3s ease;
  }
  @keyframes settings-slide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #settings-panel.open { display: block; }
  .setting-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .setting-row:last-child { margin-bottom: 0; }
  .setting-row label { color: var(--text-soft); min-width: 100px; }
  .setting-row .value { color: var(--text); min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .setting-row input[type="range"] {
    flex: 1;
    accent-color: var(--gold);
    background: transparent;
  }
  .setting-row select {
    flex: 1;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border: 1px solid rgba(245,197,66,0.18);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 13px;
    font-family: var(--font);
    outline: none;
  }
  .setting-row.check { gap: 8px; cursor: pointer; }
  .setting-row.check label { cursor: pointer; min-width: 0; flex: 1; }
  .setting-row.check input { accent-color: var(--gold); }

  .settings-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(245,197,66,0.10);
    border-radius: 999px;
    color: var(--text-soft);
    width: 32px; height: 32px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    margin-left: 8px;
  }
  .settings-btn:hover { background: rgba(245,197,66,0.10); color: var(--gold); border-color: rgba(245,197,66,0.30); }
  .settings-btn.open { background: rgba(245,197,66,0.15); color: var(--gold); border-color: rgba(245,197,66,0.40); }

  /* ── Mobile ── */
  @media (max-width: 480px) {
    header { padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
    .brand-name { font-size: 15px; }
    .brand-avatar { width: 34px; height: 34px; font-size: 16px; }
    #messages { padding: 14px 10px 18px; gap: 12px; }
    .msg-bubble { font-size: 14px; padding: 10px 13px 11px; }
    .msg-avatar { width: 28px; height: 28px; font-size: 12px; }
    .btn { width: 42px; height: 42px; }
    .agent-row { padding: 8px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-avatar" id="brand-avatar">☼</div>
    <div class="brand-text">
      <div class="brand-name"><span class="accent" id="brand-name">晴</span> · 阳光对话</div>
      <div class="brand-tag" id="brand-tag">情感陪伴</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:6px;">
    <div class="status-pill" id="status-pill">
      <span class="dot"></span>
      <span id="status-text">连接中</span>
    </div>
    <button class="settings-btn" id="settings-btn" title="设置" aria-label="设置">&#x2699;</button>
  </div>
</header>

<div id="settings-panel">
  <div class="setting-row">
    <label for="tts-rate">TTS 语速</label>
    <input type="range" id="tts-rate" min="0.5" max="1.5" step="0.05" value="0.95">
    <span class="value" id="tts-rate-val">0.95</span>
  </div>
  <div class="setting-row">
    <label for="rec-lang">识别语言</label>
    <select id="rec-lang">
      <option value="zh-CN">中文（简）</option>
      <option value="zh-TW">中文（繁）</option>
      <option value="en-US">English</option>
      <option value="ja-JP">日本語</option>
    </select>
  </div>
  <div class="setting-row check">
    <input type="checkbox" id="auto-listen">
    <label for="auto-listen">说完自动继续聆听</label>
  </div>
</div>

<div class="agent-row" id="agent-row"></div>

<div class="reconnect-bar" id="reconnect-bar">&#x21bb; 连接已断开,点击重新连接</div>

<div id="messages">
  <div class="welcome" id="welcome-msg">
    点击 <strong>麦克风</strong> 开始对话,或直接输入文字。
    <span class="tip">命令: /help · /clear · /lang zh|en|ja</span>
  </div>
</div>

<div id="input-area">
  <div class="input-wrap">
    <textarea id="text-input" placeholder="说点什么吧…" rows="1"></textarea>
  </div>
  <button class="btn send" id="send-btn" title="发送" aria-label="发送" disabled>&#x2191;</button>
  <button class="btn mic" id="mic-btn" title="语音输入" aria-label="语音输入">&#x1F3A4;</button>
</div>

<script>
(function() {
'use strict';

// ── State ──
let ws = null;
let isListening = false;
let isSpeaking = false;
let isWaitingResponse = false;
let userStoppedListening = false;
let audioCtx = null;
let pendingAudioB64 = '';
let serverTtsPending = false;
let lastFullText = '';
let currentAudioSource = null;
let serverTtsTimeoutId = null;
let currentAgent = { name: 'fair', display_name: '晴', emoji: '☼', specialty: '情感陪伴' };
let agentList = [];
let recognition = null;
let autoListenEnabled = false;
let currentAgentMsgEl = null;

const UI = {
  messages: document.getElementById('messages'),
  statusPill: document.getElementById('status-pill'),
  statusText: document.getElementById('status-text'),
  micBtn: document.getElementById('mic-btn'),
  sendBtn: document.getElementById('send-btn'),
  textInput: document.getElementById('text-input'),
  reconnectBar: document.getElementById('reconnect-bar'),
  welcomeMsg: document.getElementById('welcome-msg'),
  ttsRate: document.getElementById('tts-rate'),
  ttsRateVal: document.getElementById('tts-rate-val'),
  recLang: document.getElementById('rec-lang'),
  autoListen: document.getElementById('auto-listen'),
  settingsBtn: document.getElementById('settings-btn'),
  settingsPanel: document.getElementById('settings-panel'),
  brandAvatar: document.getElementById('brand-avatar'),
  brandName: document.getElementById('brand-name'),
  brandTag: document.getElementById('brand-tag'),
  agentRow: document.getElementById('agent-row'),
};

// ── WebSocket ──
function getWsUrl() {
  const loc = window.location;
  const protocol = loc.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${protocol}//${loc.host}/ws`;
}

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  ws = new WebSocket(getWsUrl());
  setStatus('connecting');

  ws.onopen = () => {
    setStatus('connected');
    UI.reconnectBar.classList.remove('show');
    ws.send(JSON.stringify({type: 'list_agents'}));
  };

  ws.onmessage = (e) => {
    try { handleMsg(JSON.parse(e.data)); } catch(_) {}
  };

  ws.onclose = () => {
    setStatus('disconnected');
    isWaitingResponse = false;
    stopListening(true);
    setSpeakingVisual(false);
    UI.reconnectBar.classList.add('show');
  };

  ws.onerror = () => { try { ws.close(); } catch(_){} };
}

function reconnect() {
  UI.reconnectBar.classList.remove('show');
  connect();
}

// ── Status ──
function setStatus(s) {
  UI.statusPill.classList.remove('connected', 'listening', 'speaking', 'waiting');
  switch(s) {
    case 'connected': UI.statusPill.classList.add('connected'); UI.statusText.textContent = '已连接'; break;
    case 'connecting': UI.statusText.textContent = '连接中'; break;
    case 'listening': UI.statusPill.classList.add('listening'); UI.statusText.textContent = '聆听中'; break;
    case 'speaking': UI.statusPill.classList.add('speaking'); UI.statusText.textContent = '播报中'; break;
    case 'waiting': UI.statusPill.classList.add('waiting'); UI.statusText.textContent = '思考中'; break;
    default: UI.statusText.textContent = '未连接'; break;
  }
}

function setSpeakingVisual(on) {
  UI.brandAvatar.classList.toggle('speaking', !!on);
}

// ── Message handling ──
function handleMsg(msg) {
  switch (msg.type) {
    case 'start':
      isWaitingResponse = true;
      setStatus('waiting');
      currentAgentMsgEl = null;
      showThinking();
      pendingAudioB64 = '';
      serverTtsPending = false;
      break;
    case 'content':
      hideThinking();
      if (!currentAgentMsgEl) {
        currentAgentMsgEl = createMsgEl('agent');
        currentAgentMsgEl.classList.add('streaming');
      }
      appendBubbleText(currentAgentMsgEl, msg.text || '');
      scrollBottom();
      break;
    case 'done':
      isWaitingResponse = false;
      lastFullText = msg.full_text || '';
      serverTtsPending = !!msg.tts;
      hideThinking();
      if (currentAgentMsgEl) {
        currentAgentMsgEl.classList.remove('streaming');
        // Replace partial stream text with final clean text
        const bubble = currentAgentMsgEl.querySelector('.msg-bubble');
        if (bubble && lastFullText) {
          // Preserve the name label, just replace the text
          const nameEl = bubble.querySelector('.name');
          bubble.textContent = '';
          if (nameEl) bubble.appendChild(nameEl);
          bubble.appendChild(document.createTextNode(lastFullText));
        }
        scrollBottom();
      }
      if (serverTtsPending) {
        setStatus('waiting');
        if (serverTtsTimeoutId) clearTimeout(serverTtsTimeoutId);
        serverTtsTimeoutId = setTimeout(() => {
          serverTtsTimeoutId = null;
          serverTtsPending = false;
          isSpeaking = false;
          setSpeakingVisual(false);
          setStatus('connected');
          tryAutoListen();
        }, 15000);
      } else {
        setStatus('connected');
        tryAutoListen();
      }
      break;
    case 'audio_start':
      pendingAudioB64 = '';
      setStatus('speaking');
      setSpeakingVisual(true);
      break;
    case 'audio_chunk':
      pendingAudioB64 += msg.data;
      break;
    case 'audio_end':
      if (serverTtsTimeoutId) { clearTimeout(serverTtsTimeoutId); serverTtsTimeoutId = null; }
      if (msg.error) {
        serverTtsPending = false;
        pendingAudioB64 = '';
        isSpeaking = false;
        setSpeakingVisual(false);
        setStatus('connected');
        tryAutoListen();
      } else if (pendingAudioB64) {
        playBase64Audio(pendingAudioB64);
      } else {
        isSpeaking = false;
        setSpeakingVisual(false);
        setStatus('connected');
        tryAutoListen();
      }
      pendingAudioB64 = '';
      serverTtsPending = false;
      break;
    case 'status':
      // Inline tool / activity status — render as a system note rather
      // than replacing the agent bubble.
      addSysMsg(msg.label || '');
      break;
    case 'error':
      isWaitingResponse = false;
      hideThinking();
      setSpeakingVisual(false);
      addSysMsg('错误: ' + (msg.text || ''));
      setStatus('connected');
      break;
    case 'pong':
      break;
    case 'agent_list':
      agentList = msg.agents || [];
      const match = agentList.find(a => a.name === msg.current);
      if (match) currentAgent = match;
      renderAgentChips();
      updateBrand();
      break;
    case 'agent_switched':
      currentAgent = {
        name: msg.agent,
        display_name: msg.display_name,
        emoji: msg.emoji,
        specialty: msg.specialty,
      };
      // Clear messages on switch
      UI.messages.querySelectorAll('.msg-row, .think, .sys-msg').forEach(el => el.remove());
      if (UI.welcomeMsg && !UI.welcomeMsg.isConnected) {
        UI.messages.appendChild(UI.welcomeMsg);
      }
      UI.welcomeMsg.style.display = '';
      renderAgentChips();
      updateBrand();
      addSysMsg('已切换至 ' + msg.display_name);
      break;
  }
}

// ── DOM helpers ──
function createMsgEl(role) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + role;
  avatar.textContent = role === 'user' ? '我' : (currentAgent.emoji || '*');

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = role === 'user' ? '你' : (currentAgent.display_name || 'Agent');
  bubble.appendChild(name);

  row.appendChild(avatar);
  row.appendChild(bubble);
  UI.messages.appendChild(row);
  return row;
}

function appendBubbleText(rowEl, text) {
  const bubble = rowEl.querySelector('.msg-bubble');
  if (!bubble) return;
  // Append a text node so the streaming caret pseudo-element stays after.
  bubble.appendChild(document.createTextNode(text));
}

function addSysMsg(text) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  UI.messages.appendChild(div);
  scrollBottom();
}

function showThinking() {
  hideThinking();
  const div = document.createElement('div');
  div.className = 'think';
  div.id = 'think-indicator';
  div.innerHTML =
    '<div class="think-dots"><span></span><span></span><span></span></div>' +
    '<span class="think-label">' + (currentAgent.display_name || 'Agent') + ' 在想…</span>';
  UI.messages.appendChild(div);
  scrollBottom();
}

function hideThinking() {
  const el = document.getElementById('think-indicator');
  if (el) el.remove();
}

function scrollBottom() {
  // Use requestAnimationFrame so layout settles before scrolling.
  requestAnimationFrame(() => { UI.messages.scrollTop = UI.messages.scrollHeight; });
}

function appendUserText(text) {
  const row = createMsgEl('user');
  const bubble = row.querySelector('.msg-bubble');
  bubble.appendChild(document.createTextNode(text));
  scrollBottom();
  UI.welcomeMsg.style.display = 'none';
}

// ── Speech Recognition ──
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    addSysMsg('浏览器不支持语音识别,请用 Chrome / Edge');
    UI.micBtn.disabled = true;
    return;
  }
  recognition = new SR();
  recognition.lang = UI.recLang.value;
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const text = e.results[e.results.length - 1][0].transcript;
    if (!text.trim()) return;
    stopSpeaking();
    stopListening(true);
    appendUserText(text);
    isWaitingResponse = true;
    sendSpeech(text);
    setStatus('waiting');
  };

  recognition.onerror = (e) => {
    isListening = false;
    if (e.error === 'no-speech') {
      if (autoListenEnabled && !isWaitingResponse && !isSpeaking && !userStoppedListening) {
        setTimeout(() => startListening(), 120);
      }
      return;
    }
    UI.micBtn.classList.remove('active');
    if (e.error !== 'aborted') addSysMsg('语音识别错误: ' + e.error);
    setStatus('connected');
  };

  recognition.onend = () => {
    isListening = false;
    if (autoListenEnabled && !isWaitingResponse && !isSpeaking && !userStoppedListening) {
      setTimeout(() => startListening(), 120);
    } else {
      UI.micBtn.classList.remove('active');
      if (!isWaitingResponse) setStatus('connected');
    }
  };
}

function startListening() {
  if (!recognition || isListening || isWaitingResponse || isSpeaking) return;
  try {
    recognition.lang = UI.recLang.value;
    recognition.start();
    isListening = true;
    UI.micBtn.classList.add('active');
    setStatus('listening');
  } catch(e) {
    isListening = false;
    UI.micBtn.classList.remove('active');
    setStatus('connected');
  }
}

function stopListening(silent) {
  if (recognition && isListening) {
    try { recognition.stop(); } catch(_) {}
    isListening = false;
    UI.micBtn.classList.remove('active');
    if (!silent) setStatus('connected');
  }
}

function toggleListening() {
  if (isListening) {
    userStoppedListening = true;
    stopListening();
  } else {
    userStoppedListening = false;
    ensureAudio();
    stopSpeaking();
    startListening();
  }
}

// ── Speech Synthesis ──
function stopSpeaking() {
  if (currentAudioSource) {
    try { currentAudioSource.stop(); } catch(_) {}
    currentAudioSource = null;
  }
  isSpeaking = false;
  setSpeakingVisual(false);
}

function tryAutoListen() {
  if (autoListenEnabled && !isWaitingResponse && !isSpeaking && ws && ws.readyState === WebSocket.OPEN) {
    startListening();
  }
}

// ── Agent chips ──
function renderAgentChips() {
  const row = UI.agentRow;
  if (!row) return;
  row.innerHTML = '';
  agentList.forEach(a => {
    const chip = document.createElement('div');
    chip.className = 'agent-chip' + (a.name === currentAgent.name ? ' active' : '');
    chip.setAttribute('role', 'button');
    chip.setAttribute('aria-pressed', String(a.name === currentAgent.name));
    chip.innerHTML =
      '<span class="chip-avatar">' + (a.emoji || '*') + '</span>' +
      '<span>' + (a.display_name || a.name) + '</span>';
    chip.addEventListener('click', () => switchAgent(a.name));
    row.appendChild(chip);
  });
}

function updateBrand() {
  UI.brandAvatar.textContent = currentAgent.emoji || '☼';
  UI.brandName.textContent = currentAgent.display_name || '晴';
  UI.brandTag.textContent = currentAgent.specialty || '';
}

function switchAgent(name) {
  if (name === currentAgent.name) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'switch_agent', agent: name}));
  }
}

// ── Audio context (user-gesture init for mobile) ──
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playBase64Audio(b64data) {
  try {
    const binaryStr = atob(b64data);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
    ensureAudio();
    if (audioCtx.state === 'suspended') throw new Error('AudioContext suspended - needs user interaction');
    isSpeaking = true;
    setStatus('speaking');
    setSpeakingVisual(true);
    audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      currentAudioSource = source;
      source.start(0);
      source.onended = () => {
        if (currentAudioSource === source) currentAudioSource = null;
        isSpeaking = false;
        setSpeakingVisual(false);
        setStatus('connected');
        tryAutoListen();
      };
    }, () => {
      isSpeaking = false;
      setSpeakingVisual(false);
      setStatus('connected');
      addSysMsg('语音解码失败');
      tryAutoListen();
    });
  } catch(e) {
    isSpeaking = false;
    setSpeakingVisual(false);
    setStatus('connected');
    addSysMsg('语音播放失败: ' + e.message);
    tryAutoListen();
  }
}

// ── Send ──
function sendSpeech(text) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'speech', text}));
  } else {
    addSysMsg('连接已断开,无法发送');
    connect();
  }
}

function sendText(text) {
  if (!text.trim()) return;
  if (text.startsWith('/')) { handleCommand(text); return; }
  stopSpeaking();
  stopListening(true);
  ensureAudio();
  appendUserText(text);
  isWaitingResponse = true;
  sendSpeech(text);
  setStatus('waiting');
  UI.textInput.value = '';
  UI.sendBtn.disabled = true;
  resizeTextarea();
}

// ── Commands ──
const COMMANDS = [
  { cmd: '/help', desc: '显示帮助' },
  { cmd: '/clear', desc: '清空当前对话' },
  { cmd: '/lang zh', desc: '识别语言切中文' },
  { cmd: '/lang en', desc: '识别语言切英文' },
  { cmd: '/lang ja', desc: '识别语言切日语' },
];

function handleCommand(text) {
  const parts = text.toLowerCase().split(/\s+/);
  const cmd = parts[0];
  const arg = parts.slice(1).join(' ');
  switch (cmd) {
    case '/help':
      addSysMsg('可用命令:');
      COMMANDS.forEach(c => addSysMsg(c.cmd + '  —  ' + c.desc));
      break;
    case '/clear':
      UI.messages.querySelectorAll('.msg-row, .think, .sys-msg').forEach(el => el.remove());
      if (!UI.welcomeMsg.isConnected) UI.messages.appendChild(UI.welcomeMsg);
      UI.welcomeMsg.style.display = '';
      break;
    case '/lang': {
      if (!arg) {
        addSysMsg('当前识别语言: ' + UI.recLang.value);
        break;
      }
      const langMap = { zh: 'zh-CN', en: 'en-US', ja: 'ja-JP' };
      const lang = langMap[arg] || arg;
      UI.recLang.value = lang;
      if (recognition) recognition.lang = lang;
      addSysMsg('识别语言已切换: ' + UI.recLang.options[UI.recLang.selectedIndex].text);
      break;
    }
    default:
      addSysMsg('未知命令: ' + cmd + '。输入 /help 查看');
  }
  UI.textInput.value = '';
  UI.sendBtn.disabled = true;
  resizeTextarea();
}

function resizeTextarea() {
  UI.textInput.style.height = 'auto';
  UI.textInput.style.height = Math.min(UI.textInput.scrollHeight, 140) + 'px';
}

// ── UI Events ──
UI.micBtn.addEventListener('click', toggleListening);
UI.sendBtn.addEventListener('click', () => sendText(UI.textInput.value));
UI.textInput.addEventListener('input', () => {
  resizeTextarea();
  UI.sendBtn.disabled = !UI.textInput.value.trim();
});
UI.textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (UI.textInput.value.trim()) sendText(UI.textInput.value);
  }
});
UI.reconnectBar.addEventListener('click', reconnect);
UI.ttsRate.addEventListener('input', () => { UI.ttsRateVal.textContent = UI.ttsRate.value; });
UI.recLang.addEventListener('change', () => { if (recognition) recognition.lang = UI.recLang.value; });
UI.autoListen.addEventListener('change', () => { autoListenEnabled = UI.autoListen.checked; });
UI.settingsBtn.addEventListener('click', () => {
  const open = UI.settingsPanel.classList.toggle('open');
  UI.settingsBtn.classList.toggle('open', open);
});

// ── Init ──
connect();
initRecognition();

window.addEventListener('online', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) connect();
});

setInterval(() => {
  if (!ws || ws.readyState !== WebSocket.OPEN) UI.reconnectBar.classList.add('show');
}, 5000);

})();
</script>
</body>
</html>
