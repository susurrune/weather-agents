<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晴 · 阳光对话</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #e8b84b;
    --gold-light: #f5d980;
    --gold-dark: #b8860b;
    --bg: #1a1a2e;
    --bg-card: #232340;
    --bg-user: #2a2a4a;
    --text: #e8e0d0;
    --text-dim: #988e7a;
    --green: #5cd68a;
    --red: #e06060;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  }
  html { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--bg-card), #2a1f3a);
    border-bottom: 1px solid rgba(232,184,75,0.15);
    flex-shrink: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  header h1 span { color: var(--gold); }
  header h1 small { font-size: 12px; font-weight: 400; color: var(--text-dim); margin-left: 6px; }
  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
  }
  #status-dot.connected { background: var(--green); box-shadow: 0 0 6px rgba(92,214,138,0.5); }
  #status-dot.listening { background: var(--gold); box-shadow: 0 0 8px rgba(232,184,75,0.6); animation: pulse 1s infinite; }
  #status-dot.speaking { background: #7eb8e0; box-shadow: 0 0 8px rgba(126,184,224,0.6); }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }
  /* ── Messages ── */
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(232,184,75,0.2); border-radius: 2px; }
  .msg {
    max-width: 88%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    align-self: flex-end;
    background: var(--bg-user);
    border: 1px solid rgba(232,184,75,0.15);
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(232,184,75,0.08), rgba(200,160,60,0.04));
    border: 1px solid rgba(232,184,75,0.12);
    border-bottom-left-radius: 4px;
  }
  .msg .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .msg.user .label { color: var(--gold); }
  .msg.agent .label { color: var(--gold-dark); }
  .msg.agent .text { color: var(--text); }
  .msg.agent.streaming .text::after {
    content: "";
    display: inline-block;
    width: 6px; height: 14px;
    background: var(--gold);
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  /* ── Status message ── */
  .msg.status-msg {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 12px;
    text-align: center;
    max-width: 100%;
  }
  /* ── Think ── */
  .think-indicator {
    display: flex; align-items: center; gap: 8px;
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 13px;
    padding: 8px 16px;
    margin-left: 4px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(232,184,75,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ── Input Area ── */
  #input-area {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--bg-card);
    border-top: 1px solid rgba(232,184,75,0.1);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #text-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid rgba(232,184,75,0.2);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font);
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.4;
    transition: border-color 0.2s;
  }
  #text-input:focus { border-color: var(--gold); }
  #text-input::placeholder { color: var(--text-dim); }
  .btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: none;
    background: var(--gold);
    color: #1a1a2e;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn:active { transform: scale(0.92); }
  .btn.send { background: var(--gold); }
  .btn.send:hover { background: var(--gold-light); }
  .btn.mic { background: var(--gold); }
  .btn.mic:hover { background: var(--gold-light); }
  .btn.mic.active {
    background: var(--red);
    box-shadow: 0 0 12px rgba(224,96,96,0.4);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  /* ── Wave animation ── */
  .wave {
    display: flex; align-items: center; gap: 3px;
    margin-left: 4px;
  }
  .wave span {
    display: inline-block;
    width: 3px;
    height: 12px;
    background: var(--gold);
    border-radius: 2px;
    animation: wave 1s infinite ease-in-out;
  }
  .wave span:nth-child(2) { animation-delay: 0.15s; height: 16px; }
  .wave span:nth-child(3) { animation-delay: 0.3s; height: 10px; }
  .wave span:nth-child(4) { animation-delay: 0.45s; height: 18px; }
  .wave span:nth-child(5) { animation-delay: 0.6s; height: 12px; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.6); }
    50% { transform: scaleY(1.2); }
  }
  /* ── Agent profile ── */
  .agent-profile {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    background: rgba(232,184,75,0.04);
    border-bottom: 1px solid rgba(232,184,75,0.06);
    flex-shrink: 0;
  }
  .agent-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: #1a1a2e;
    font-weight: bold;
  }
  .agent-info { font-size: 13px; }
  .agent-info .name { font-weight: 600; color: var(--gold); }
  .agent-info .tag { font-size: 11px; color: var(--text-dim); }
  .settings {
    margin-left: auto;
    background: none; border: none;
    color: var(--text-dim); font-size: 18px;
    cursor: pointer; padding: 4px;
  }
  /* ── Settings panel ── */
  #settings-panel {
    display: none;
    padding: 12px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid rgba(232,184,75,0.1);
    flex-shrink: 0;
    font-size: 13px;
  }
  #settings-panel.open { display: block; }
  #settings-panel label {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
    color: var(--text-dim);
    cursor: pointer;
  }
  #settings-panel select, #settings-panel input[type="range"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid rgba(232,184,75,0.2);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 13px;
  }
  #settings-panel select { margin-left: auto; }
  .setting-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .setting-row .value { color: var(--text); min-width: 28px; text-align: center; }
  /* ── Agent selector modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-card);
    border: 1px solid rgba(232,184,75,0.15);
    border-radius: 20px;
    padding: 20px;
    width: 280px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 16px; color: var(--gold); margin-bottom: 12px; text-align: center; letter-spacing: 1px; }
  .agent-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }
  .agent-option:hover { background: rgba(232,184,75,0.1); }
  .agent-option.active { background: rgba(232,184,75,0.15); border: 1px solid rgba(232,184,75,0.3); }
  .agent-option .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #1a1a2e; font-weight: bold; flex-shrink: 0;
  }
  .agent-option .info { flex: 1; min-width: 0; }
  .agent-option .info .name { font-weight: 600; font-size: 14px; color: var(--text); }
  .agent-option .info .spec { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-option .check { color: var(--gold); font-size: 18px; flex-shrink: 0; }
  /* ── Reconnect ── */
  .reconnect-bar {
    display: none;
    text-align: center;
    padding: 8px;
    background: rgba(224,96,96,0.15);
    color: var(--red);
    font-size: 13px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .reconnect-bar.show { display: block; }
  .reconnect-bar:hover { background: rgba(224,96,96,0.25); }
  /* ── Responsive ── */
  @media (max-width: 480px) {
    header { padding: 10px 12px; }
    header h1 { font-size: 16px; }
    #messages { padding: 12px; }
    .msg { max-width: 92%; font-size: 14px; padding: 10px 14px; }
    #input-area { padding: 8px 12px; gap: 6px; }
    .btn { width: 40px; height: 40px; font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <h1><span>晴</span><small>阳光对话</small></h1>
  <div id="status">
    <span id="status-dot"></span>
    <span id="status-text">连接中...</span>
  </div>
</header>

<div class="agent-profile" id="agent-profile">
  <div class="agent-avatar" id="agent-avatar">*</div>
  <div class="agent-info">
    <div class="name" id="agent-name">晴</div>
    <div class="tag" id="agent-tag">情感陪伴</div>
  </div>
  <button class="settings" id="settings-btn" title="设置">&#x2699;</button>
</div>

<div id="settings-panel">
  <div class="setting-row">
    <label>TTS 语速</label>
    <input type="range" id="tts-rate" min="0.5" max="1.5" step="0.05" value="0.95">
    <span class="value" id="tts-rate-val">0.95</span>
  </div>
  <div class="setting-row">
    <label>语音识别语言</label>
    <select id="rec-lang">
      <option value="zh-CN">中文</option>
      <option value="en-US">English</option>
      <option value="ja-JP">日本語</option>
      <option value="zh-TW">中文(台湾)</option>
    </select>
  </div>
  <label>
    <input type="checkbox" id="auto-listen">
    自动循环收听（说完后自动开始聆听）
  </label>
</div>

<div class="modal-overlay" id="agent-modal">
  <div class="modal">
    <h2>选择 Agent</h2>
    <div id="agent-list"></div>
  </div>
</div>

<div class="reconnect-bar" id="reconnect-bar">
  &#x21bb; 连接断开，点击重新连接
</div>

<div id="messages">
  <div class="msg status-msg" id="welcome-msg">&#x2600; 点击麦克风按钮开始语音对话</div>
</div>

<div id="input-area">
  <textarea id="text-input" placeholder="或输入文字..." rows="1"></textarea>
  <button class="btn send" id="send-btn" title="发送" disabled>&#x2191;</button>
  <button class="btn mic" id="mic-btn" title="语音输入">&#x1F3A4;</button>
</div>

<script>
(function() {
'use strict';

// ── State ──
let ws = null;
let isListening = false;
let isSpeaking = false;
let isWaitingResponse = false;
let reconnectTimer = null;
let audioCtx = null;
let pendingAudioB64 = '';
let serverTtsPending = false;
let lastFullText = '';
let currentAudioSource = null;
let serverTtsTimeoutId = null;
let currentAgent = { name: 'sunshine', display_name: '晴', emoji: '*', specialty: '情感陪伴' };
let agentList = [];

const UI = {
  messages: document.getElementById('messages'),
  statusDot: document.getElementById('status-dot'),
  statusText: document.getElementById('status-text'),
  connInfo: document.getElementById('conn-info'),
  micBtn: document.getElementById('mic-btn'),
  sendBtn: document.getElementById('send-btn'),
  textInput: document.getElementById('text-input'),
  reconnectBar: document.getElementById('reconnect-bar'),
  welcomeMsg: document.getElementById('welcome-msg'),
  ttsRate: document.getElementById('tts-rate'),
  ttsRateVal: document.getElementById('tts-rate-val'),
  recLang: document.getElementById('rec-lang'),
  autoListen: document.getElementById('auto-listen'),
  settingsBtn: document.getElementById('settings-btn'),
  settingsPanel: document.getElementById('settings-panel'),
  agentProfile: document.getElementById('agent-profile'),
  agentAvatar: document.getElementById('agent-avatar'),
  agentName: document.getElementById('agent-name'),
  agentTag: document.getElementById('agent-tag'),
  headerTitle: document.querySelector('header h1'),
  agentModal: document.getElementById('agent-modal'),
  agentListEl: document.getElementById('agent-list'),
};
let recognition = null;
let autoListenEnabled = false;

// ── WebSocket ──
function getWsUrl() {
  const loc = window.location;
  const protocol = loc.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${protocol}//${loc.host}/ws`;
}

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  const url = getWsUrl();
  ws = new WebSocket(url);
  setStatus('connecting');

  ws.onopen = () => {
    setStatus('connected');
    UI.reconnectBar.classList.remove('show');
    UI.connInfo.textContent = '已连接';
    ws.send(JSON.stringify({type: 'list_agents'}));
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMsg(msg);
    } catch(_) { /* ignore malformed */ }
  };

  ws.onclose = () => {
    setStatus('disconnected');
    UI.connInfo.textContent = '已断开';
    isWaitingResponse = false;
    stopListening(true);
    if (!reconnectTimer) {
      UI.reconnectBar.classList.add('show');
    }
  };

  ws.onerror = () => { ws.close(); };
}

function reconnect() {
  UI.reconnectBar.classList.remove('show');
  connect();
}

// ── Status ──
function setStatus(s) {
  UI.statusDot.className = '';
  switch(s) {
    case 'connected': UI.statusDot.classList.add('connected'); UI.statusText.textContent = '已连接'; break;
    case 'connecting': UI.statusText.textContent = '连接中...'; break;
    case 'listening': UI.statusDot.classList.add('listening'); UI.statusText.textContent = '聆听中...'; break;
    case 'speaking': UI.statusDot.classList.add('speaking'); UI.statusText.textContent = '播报中...'; break;
    case 'waiting': UI.statusText.textContent = '思考中...'; break;
    default: UI.statusText.textContent = '未连接'; break;
  }
}

// ── Message handling ──
let currentAgentMsgEl = null;

function handleMsg(msg) {
  switch (msg.type) {
    case 'start':
      isWaitingResponse = true;
      setStatus('waiting');
      currentAgentMsgEl = null;
      showThinking();
      // Clear any pending audio from previous response
      pendingAudioB64 = '';
      serverTtsPending = false;
      break;
    case 'content':
      hideThinking();
      if (!currentAgentMsgEl) {
        currentAgentMsgEl = createMsgEl('agent');
        currentAgentMsgEl.classList.add('streaming');
      }
      const textEl = currentAgentMsgEl.querySelector('.text');
      textEl.textContent += msg.text;
      scrollBottom();
      break;
    case 'done':
      isWaitingResponse = false;
      lastFullText = msg.full_text || '';
      serverTtsPending = !!msg.tts;
      if (currentAgentMsgEl) {
        currentAgentMsgEl.classList.remove('streaming');
        currentAgentMsgEl.querySelector('.text').textContent = lastFullText;
        scrollBottom();
      } else {
        hideThinking();
      }
      if (!serverTtsPending) {
        // No server-side TTS configured — response is text-only
      } else {
        setStatus('waiting');
        // Guard: if server TTS doesn't deliver within 15s, silently give up
        if (serverTtsTimeoutId) clearTimeout(serverTtsTimeoutId);
        serverTtsTimeoutId = setTimeout(() => {
          serverTtsTimeoutId = null;
          serverTtsPending = false;
          isSpeaking = false;
          setStatus('connected');
          tryAutoListen();
        }, 15000);
      }
      break;
    case 'audio_start':
      pendingAudioB64 = '';
      setStatus('speaking');
      break;
    case 'audio_chunk':
      pendingAudioB64 += msg.data;
      break;
    case 'audio_end':
      if (serverTtsTimeoutId) { clearTimeout(serverTtsTimeoutId); serverTtsTimeoutId = null; }
      if (msg.error) {
        serverTtsPending = false;
        pendingAudioB64 = '';
        isSpeaking = false;
        setStatus('connected');
        tryAutoListen();
      } else if (pendingAudioB64) {
        playBase64Audio(pendingAudioB64);
      } else {
        isSpeaking = false;
        setStatus('connected');
        tryAutoListen();
      }
      pendingAudioB64 = '';
      serverTtsPending = false;
      break;
    case 'status':
      if (!currentAgentMsgEl) {
        hideThinking();
        const el = createMsgEl('agent');
        el.innerHTML = '<div class="text" style="color:var(--text-dim);font-size:13px;">' + msg.label + '</div>';
      }
      break;
    case 'error':
      isWaitingResponse = false;
      hideThinking();
      addStatusMsg('error: ' + msg.text);
      break;
    case 'pong':
      break;
    case 'agent_list':
      agentList = msg.agents || [];
      const match = agentList.find(a => a.name === msg.current);
      if (match) currentAgent = match;
      updateAgentUI();
      break;
    case 'agent_switched':
      currentAgent = { name: msg.agent, display_name: msg.display_name, emoji: msg.emoji, specialty: msg.specialty };
      // Clear messages on agent switch
      UI.messages.querySelectorAll('.msg, .think-indicator').forEach(el => el.remove());
      updateAgentUI();
      addStatusMsg('已切换至 ' + msg.display_name);
      break;
  }
}

// ── DOM helpers ──
function createMsgEl(role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="label">' + (role === 'user' ? '你' : currentAgent.emoji + ' ' + currentAgent.display_name) + '</div><div class="text"></div>';
  UI.messages.appendChild(div);
  return div;
}

function addStatusMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg status-msg';
  div.textContent = text;
  UI.messages.appendChild(div);
  scrollBottom();
}

function showThinking() {
  hideThinking();
  const div = document.createElement('div');
  div.className = 'think-indicator';
  div.id = 'think-indicator';
  div.innerHTML = '<div class="spinner"></div>' + currentAgent.display_name + ' 正在思考...';
  UI.messages.appendChild(div);
  scrollBottom();
}

function hideThinking() {
  const el = document.getElementById('think-indicator');
  if (el) el.remove();
}

function scrollBottom() {
  UI.messages.scrollTop = UI.messages.scrollHeight;
}

function appendUserText(text) {
  const el = createMsgEl('user');
  el.querySelector('.text').textContent = text;
  scrollBottom();
  UI.welcomeMsg.style.display = 'none';
}

// ── Speech Recognition ──
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    addStatusMsg('浏览器不支持语音识别，请使用 Chrome 或 Edge');
    UI.micBtn.disabled = true;
    return;
  }
  recognition = new SR();
  recognition.lang = UI.recLang.value;
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const text = e.results[e.results.length - 1][0].transcript;
    if (!text.trim()) return;
    stopSpeaking();
    stopListening(true);
    appendUserText(text);
    isWaitingResponse = true;
    sendSpeech(text);
    setStatus('waiting');
  };

  recognition.onerror = (e) => {
    console.warn('recognition error:', e.error);
    isListening = false;
    if (e.error === 'no-speech') {
      if (autoListenEnabled && !isWaitingResponse && !isSpeaking && !userStoppedListening) {
        setTimeout(() => startListening(), 100);
      }
      return;
    }
    UI.micBtn.classList.remove('active');
    if (e.error !== 'aborted') {
      addStatusMsg('语音识别错误: ' + e.error);
    }
    setStatus('connected');
  };

  recognition.onend = () => {
    isListening = false;
    if (autoListenEnabled && !isWaitingResponse && !isSpeaking && !userStoppedListening) {
      // Auto-restart without toggling active state to avoid visual flash
      setTimeout(() => startListening(), 100);
    } else {
      UI.micBtn.classList.remove('active');
      if (!isWaitingResponse) setStatus('connected');
    }
  };
}

function startListening() {
  if (!recognition || isListening || isWaitingResponse || isSpeaking) return;
  try {
    recognition.lang = UI.recLang.value;
    recognition.start();
    isListening = true;
    UI.micBtn.classList.add('active');
    setStatus('listening');
  } catch(e) {
    if (e.name !== 'InvalidStateError') console.warn('startListening error:', e);
    isListening = false;
    UI.micBtn.classList.remove('active');
    setStatus('connected');
  }
}

function stopListening(silent) {
  if (recognition && isListening) {
    try { recognition.stop(); } catch(_) {}
    isListening = false;
    UI.micBtn.classList.remove('active');
    if (!silent) setStatus('connected');
  }
}

function toggleListening() {
  if (isListening) {
    userStoppedListening = true;
    stopListening();
  } else {
    userStoppedListening = false;
    ensureAudio();
    stopSpeaking();
    startListening();
  }
}

// ── Speech Synthesis ──
let userStoppedListening = false;

function stopSpeaking() {
  if (currentAudioSource) {
    try { currentAudioSource.stop(); } catch(_) {}
    currentAudioSource = null;
  }
  isSpeaking = false;
}

function tryAutoListen() {
  if (autoListenEnabled && !isWaitingResponse && !isSpeaking && ws && ws.readyState === WebSocket.OPEN) {
    startListening();
  }
}

// ── Agent Selector ──
function updateAgentUI() {
  UI.agentAvatar.textContent = currentAgent.emoji;
  UI.agentName.textContent = currentAgent.display_name;
  UI.agentTag.textContent = currentAgent.specialty;
  const titleSpan = UI.headerTitle.querySelector('span');
  if (titleSpan) titleSpan.textContent = currentAgent.display_name;
}

function openAgentModal() {
  populateAgentList();
  UI.agentModal.classList.add('open');
}

function closeAgentModal() {
  UI.agentModal.classList.remove('open');
}

function populateAgentList() {
  const list = UI.agentListEl;
  if (!list) return;
  list.innerHTML = '';
  agentList.forEach(a => {
    const div = document.createElement('div');
    div.className = 'agent-option' + (a.name === currentAgent.name ? ' active' : '');
    div.innerHTML =
      '<div class="avatar">' + a.emoji + '</div>' +
      '<div class="info"><div class="name">' + a.display_name + '</div><div class="spec">' + a.specialty + '</div></div>' +
      (a.name === currentAgent.name ? '<div class="check">&#x2713;</div>' : '');
    div.addEventListener('click', function() { switchAgent(a.name); });
    list.appendChild(div);
  });
}

function switchAgent(name) {
  if (name === currentAgent.name) { closeAgentModal(); return; }
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'switch_agent', agent: name}));
  }
  closeAgentModal();
}

// ── Audio context (must be created/resumed from user gesture on mobile) ──
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// ── Audio playback (Doubao TTS) ──
function playBase64Audio(b64data) {
  try {
    const binaryStr = atob(b64data);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) {
      bytes[i] = binaryStr.charCodeAt(i);
    }
    ensureAudio();
    if (audioCtx.state === 'suspended') {
      throw new Error('AudioContext suspended - needs user interaction');
    }
    isSpeaking = true;
    setStatus('speaking');
    audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      currentAudioSource = source;
      source.start(0);
      source.onended = () => {
        if (currentAudioSource === source) currentAudioSource = null;
        isSpeaking = false;
        setStatus('connected');
        tryAutoListen();
      };
    }, (err) => {
      console.warn('audio decode error:', err);
      isSpeaking = false;
      setStatus('connected');
      addStatusMsg('语音解码失败，请检查音频格式');
      tryAutoListen();
    });
  } catch(e) {
    console.warn('playBase64Audio error:', e);
    isSpeaking = false;
    setStatus('connected');
    addStatusMsg('语音播放失败: ' + e.message);
    tryAutoListen();
  }
}

// ── Send ──
function sendSpeech(text) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'speech', text}));
  } else {
    addStatusMsg('连接已断开，无法发送');
    connect();
  }
}

function sendText(text) {
  if (!text.trim()) return;
  // Handle slash commands locally
  if (text.startsWith('/')) {
    handleCommand(text);
    return;
  }
  stopSpeaking();
  stopListening(true);
  ensureAudio();
  appendUserText(text);
  isWaitingResponse = true;
  sendSpeech(text);
  setStatus('waiting');
  UI.textInput.value = '';
  UI.sendBtn.disabled = true;
  UI.textInput.style.height = 'auto';
}

// ── Slash Commands ──
const COMMANDS = [
  { cmd: '/help', desc: '显示帮助信息' },
  { cmd: '/clear', desc: '清空聊天记录' },
  { cmd: '/lang zh', desc: '切换语音识别为中文' },
  { cmd: '/lang en', desc: '切换语音识别为英文' },
  { cmd: '/lang ja', desc: '切换语音识别为日语' },
];

function handleCommand(text) {
  const parts = text.toLowerCase().split(/\s+/);
  const cmd = parts[0];
  const arg = parts.slice(1).join(' ');

  switch (cmd) {
    case '/help':
      addStatusMsg('可用命令:');
      COMMANDS.forEach(c => {
        const el = document.createElement('div');
        el.className = 'msg status-msg';
        el.style.display = 'flex';
        el.style.justifyContent = 'center';
        el.style.gap = '12px';
        el.innerHTML = '<span style="color:var(--gold);font-family:monospace;">' + c.cmd + '</span> <span style="color:var(--text-dim)">' + c.desc + '</span>';
        UI.messages.appendChild(el);
      });
      scrollBottom();
      break;

    case '/clear':
      UI.messages.querySelectorAll('.msg').forEach(el => el.remove());
      UI.welcomeMsg.style.display = 'block';
      scrollBottom();
      break;

    case '/lang':
      if (!arg) {
        addStatusMsg('当前语言: ' + UI.recLang.value + '。使用 /lang zh|en|ja 切换');
        break;
      }
      const langMap = { zh: 'zh-CN', en: 'en-US', ja: 'ja-JP' };
      const lang = langMap[arg] || arg;
      UI.recLang.value = lang;
      if (recognition) recognition.lang = lang;
      addStatusMsg('语音识别已切换至: ' + UI.recLang.options[UI.recLang.selectedIndex].text);
      break;

    default:
      addStatusMsg('未知命令: ' + cmd + '。输入 /help 查看可用命令');
  }
  UI.textInput.value = '';
  UI.sendBtn.disabled = true;
  UI.textInput.style.height = 'auto';
}

// ── UI Events ──
UI.micBtn.addEventListener('click', toggleListening);

UI.sendBtn.addEventListener('click', () => {
  sendText(UI.textInput.value);
});

UI.textInput.addEventListener('input', () => {
  UI.textInput.style.height = 'auto';
  UI.textInput.style.height = Math.min(UI.textInput.scrollHeight, 120) + 'px';
  UI.sendBtn.disabled = !UI.textInput.value.trim();
});

UI.textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (UI.textInput.value.trim()) sendText(UI.textInput.value);
  }
});

UI.reconnectBar.addEventListener('click', reconnect);

UI.ttsRate.addEventListener('input', () => {
  UI.ttsRateVal.textContent = UI.ttsRate.value;
});

UI.recLang.addEventListener('change', () => {
  if (recognition) recognition.lang = UI.recLang.value;
});

UI.autoListen.addEventListener('change', () => {
  autoListenEnabled = UI.autoListen.checked;
});

UI.settingsBtn.addEventListener('click', () => {
  UI.settingsPanel.classList.toggle('open');
});

UI.agentProfile.addEventListener('click', openAgentModal);

UI.agentModal.addEventListener('click', (e) => {
  if (e.target === UI.agentModal) closeAgentModal();
});

// ── Init ──
connect();
initRecognition();

// Auto-reconnect on disconnect
window.addEventListener('online', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) connect();
});

// Periodic reconnect check
setInterval(() => {
  if ((!ws || ws.readyState !== WebSocket.OPEN) && !reconnectTimer) {
    UI.reconnectBar.classList.add('show');
  }
}, 5000);

})();
</script>
