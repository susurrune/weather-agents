<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a056"/>
      <stop offset="35%" stop-color="#b8741a"/>
      <stop offset="70%" stop-color="#8a4a12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3ead7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f3ead7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="50%" cy="90%" r="70%">
      <stop offset="0%" stop-color="#ebe0c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ebe0c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background: paper tone -->
  <rect width="64" height="64" rx="16" fill="#2a1f17"/>

  <!-- outer atmospheric rings -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#574635" stroke-width="0.5" opacity="0.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#574635" stroke-width="0.3" opacity="0.35"/>

  <!-- six agent marks: subtle dots around the edge -->
  <g opacity="0.7">
    <!-- fog 雾: top-left -->
    <circle cx="16" cy="16" r="1.5" fill="#b9a684"/>
    <!-- rain 雨: top-right -->
    <circle cx="48" cy="14" r="1.5" fill="#8a7659"/>
    <!-- frost 霜: right -->
    <circle cx="50" cy="32" r="1.5" fill="#b9a684"/>
    <!-- snow 雪: bottom-right -->
    <circle cx="47" cy="49" r="1.5" fill="#8a7659"/>
    <!-- dew 露: bottom-left -->
    <circle cx="17" cy="50" r="1.5" fill="#b9a684"/>
    <!-- fair 晴: top-center (slightly larger, amber accent) -->
    <circle cx="32" cy="10" r="2" fill="#d4a056"/>
  </g>

  <!-- mist layer -->
  <ellipse cx="32" cy="44" rx="24" ry="10" fill="url(#mist)"/>

  <!-- central sun -->
  <circle cx="32" cy="32" r="12" fill="url(#sun)" opacity="0.9"/>

  <!-- warm glow behind sun -->
  <circle cx="32" cy="32" r="22" fill="url(#glow)"/>

  <!-- subtle inner corona -->
  <circle cx="32" cy="32" r="9" fill="none" stroke="#d4a056" stroke-width="0.5" opacity="0.5"/>
</svg>
