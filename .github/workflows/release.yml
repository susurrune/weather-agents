name: Release

# Trigger: push a tag like v1.0.0, or dispatch manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag override (e.g. v1.0.1)"
        required: false
        default: ""

permissions:
  contents: write  # needed to upload release assets

jobs:
  # ── Desktop binaries (PyInstaller) ──────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: .exe
            archive: zip
          - os: macos-latest
            ext: ""
            archive: tar.gz
          - os: ubuntu-latest
            ext: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[desktop]"
          pip install pyinstaller

      - name: Build desktop app
        run: pyinstaller packaging/sky-desktop.spec --noconfirm

      - name: Selftest
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./dist/Skyloom/Skyloom.exe --selftest
          else
            ./dist/Skyloom/Skyloom --selftest
          fi

      - name: Archive
        id: archive
        shell: bash
        run: |
          P="Skyloom-${{ runner.os }}-${{ runner.arch }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "../${P}.zip" Skyloom/)
            echo "asset=${P}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${P}.tar.gz" -C dist Skyloom/
            echo "asset=${P}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.asset }}
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          fail_on_unmatched: true

  # ── Mobile PWA / Android APK (Capacitor) ───────────────────────────────
  mobile-android:
    name: Mobile Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor CLI + TypeScript
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android typescript

      - name: Bootstrap Capacitor Android project
        run: |
          mkdir -p mobile/skyloom-app
          cd mobile/skyloom-app
          # Capacitor expects a web app in www/ — we point it at our voice client.
          # The actual runtime needs the voice server, so the "app" opens the
          # user's Cloudflare or LAN URL (entered once, stored in localStorage).
          cat > capacitor.config.ts <<'CAPCONF'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'dev.skyloom.app',
            appName: 'Skyloom',
            webDir: 'www',
            server: { cleartext: true },
            android: { allowMixedContent: true },
          };
          export default config;
          CAPCONF

          # Thin shell page — a launcher that asks for the server URL, then loads
          # the full voice client in an iframe (or redirects).
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!DOCTYPE html><html lang="zh"><head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#2a1f17"><title>Skyloom</title>
          <style>
            *{margin:0;padding:0;box-sizing:border-box}
            body{background:#2a1f17;color:#f3ead7;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;gap:16px;padding:24px}
            h1{font-size:28px;font-weight:300;letter-spacing:.06em}
            input{width:100%;max-width:340px;padding:12px 16px;border-radius:8px;border:1px solid rgba(243,234,215,.35);background:rgba(243,234,215,.08);color:#f3ead7;font-size:16px;text-align:center}
            input:focus{outline:none;border-color:#d4a056}
            button{padding:12px 32px;border-radius:8px;border:none;background:#d4a056;color:#2a1f17;font-size:16px;font-weight:500;cursor:pointer}
            button:active{opacity:.8}
            .hint{font-size:13px;color:rgba(243,234,215,.5);max-width:300px;text-align:center;line-height:1.5}
            a{color:#d4a056}
          </style></head><body>
          <h1>Skyloom</h1>
          <input id="url" type="url" placeholder="粘贴 sky app 的公网网址" autofocus>
          <button onclick="go()">连接</button>
          <div class="hint">桌面端运行 <code>sky app</code> 得到网址，粘贴到上方。<br>首次开通请 <a href="https://github.com/susurrune/skyloom#readme">查看文档</a>。</div>
          <div class="hint" style="margin-top:16px">或直接 <input type="file" accept=".json,image/*" style="display:none" id="qrfile" onchange="scanQR(this)"><button onclick="document.getElementById('qrfile').click()" style="background:transparent;color:#f3ead7;border:1px solid rgba(243,234,215,.3)">📷 扫描二维码</button></div>
          <script>
          const STORED = 'skyloom-url';
          (function(){let v=null;try{v=localStorage.getItem(STORED)}catch(_){}if(v){document.getElementById('url').value=v}})();
          function go(){let u=document.getElementById('url').value.trim();if(!u)return;u=u.replace(/\/+$/,'');try{localStorage.setItem(STORED,u)}catch(_){}location.href=u}
          </script>
          </body></html>
          HTML

          npx cap add android

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build APK
        run: |
          cd mobile/skyloom-app
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Skyloom-android.apk

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/Skyloom-android.apk
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          fail_on_unmatched: true
