name: Release

# Trigger: push a tag like v1.0.0, or dispatch manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag override (e.g. v1.0.1)"
        required: false
        default: ""

permissions:
  contents: write  # needed to upload release assets

jobs:
  # ── Desktop binaries (PyInstaller) ──────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: .exe
            archive: zip
          - os: macos-latest
            ext: ""
            archive: tar.gz
          - os: ubuntu-latest
            ext: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[desktop]"
          pip install pyinstaller

      - name: Build desktop app
        run: pyinstaller packaging/sky-desktop.spec --noconfirm

      - name: Selftest
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./dist/Skyloom/Skyloom.exe --selftest
          else
            ./dist/Skyloom/Skyloom --selftest
          fi

      - name: Archive
        id: archive
        shell: bash
        run: |
          P="Skyloom-${{ runner.os }}-${{ runner.arch }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "../${P}.zip" Skyloom/)
            echo "asset=${P}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${P}.tar.gz" -C dist Skyloom/
            echo "asset=${P}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.asset }}
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          fail_on_unmatched: true
